<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fiza Enterprises | Admin</title><link rel="stylesheet" href="/admin.css"></head>
<body><div id="login" class="login"><div class="login-card"><div class="logo">✦ FIZA ENTERPRISES</div><p>SECURE ADMIN</p><input id="user" placeholder="Username" autocomplete="username"><input id="pass" type="password" placeholder="Password" autocomplete="current-password"><button onclick="login()">Sign in</button><div id="loginMsg"></div></div></div>
<div id="app" class="hidden"><aside><div class="logo">✦ FIZA<br>ENTERPRISES</div><a href="/">View Website</a><a href="#dashboard">Dashboard</a><a href="#enquiries">Enquiries</a><a href="#packages">Packages</a><a href="#settings">Settings</a><button onclick="logout()">Log out</button></aside><main><header><span>ADMIN DASHBOARD</span><b id="who"></b></header><section id="dashboard"><h1>Good day.</h1><div class="stats"><div>Total Enquiries<b id="total">0</b></div><div>New<b id="new">0</b></div><div>Hajj<b id="hajj">0</b></div><div>Umrah<b id="umrah">0</b></div></div></section>
<section id="enquiries" class="panel"><h2>Enquiries</h2><div class="tablewrap"><table><thead><tr><th>Name</th><th>Interest</th><th>Package</th><th>Phone</th><th>City</th><th>Travel</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div></section>
<section id="packages" class="panel"><h2>Packages <button class="small" onclick="newPackage()">+ Add</button></h2><div id="packageList"></div></section>
<section id="settings" class="panel"><h2>Business Settings</h2><div class="grid"><label>Business Name<input id="s_name"></label><label>Tagline<input id="s_tagline"></label><label>Phone<input id="s_phone"></label><label>WhatsApp<input id="s_whatsapp"></label><label>Email<input id="s_email"></label><label>Location<input id="s_location"></label></div><button onclick="saveSettings()">Save Settings</button><p id="saveMsg"></p></section></main></div>
<div id="modal" class="modal hidden"><div class="modal-card"><h2 id="modalTitle">Package</h2><input type="hidden" id="pid"><label>Type<select id="ptype"><option>Hajj</option><option>Umrah</option></select></label><label>Name<input id="pname"></label><label>Subtitle<input id="psub"></label><label>Description<textarea id="pdesc"></textarea></label><label>Price label<input id="pprice" value="Contact us"></label><label>Duration<input id="pduration"></label><label>Makkah hotel/options<input id="pmakkah"></label><label>Madinah hotel/options<input id="pmadinah"></label><label>Inclusions (one per line)<textarea id="pinc"></textarea></label><label>Image URL<input id="pimage"></label><div><button onclick="savePackage()">Save</button><button class="cancel" onclick="closeModal()">Cancel</button></div></div></div>
<script src="/admin.js"></script></body></html>
